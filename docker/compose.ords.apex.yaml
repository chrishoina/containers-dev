services:
  db23:
    image: container-registry.oracle.com/database/free:23.26.0.0
    environment:
      - ORACLE_PDB=${ORACLE_PDB}
      - ORACLE_PWD=${ORACLE_PWD}
   
    volumes:
      - db_k6_testing:/opt/oracle/oradata/

    ports:
      - "1521:1521"
    networks:
      - appnet
    
    env_file:
      - ./.env
  ords:
    restart: on-failure
    hostname: ords
    image: container-registry.oracle.com/database/ords:latest
    environment:
      - DBSERVICENAME=${ORACLE_PDB}
      - DBHOST=db23
      - DBPORT=${DBPORT}
      - ORACLE_PWD=${ORACLE_PWD}
      - APEX_PWD=${APEX_PWD}

      #Modify JDK_JAVA_OPTIONS to adjust the JVM memory
      #- JDK_JAVA_OPTIONS=-Xms1024M -Xmx1024M
    volumes:
      - ords_config_k6_testing:/etc/ords/config
      - ~/containers-dev/docker-examples/apex-latest/apex:/opt/oracle/apex
    ports:
      - 8080:8080
    
    networks:
      - appnet

    healthcheck:
      test: curl --noproxy "localhost" -f -k http://localhost:8080/ords/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 150
    depends_on:
      db23:
        condition: service_healthy
volumes:
  db_k6_testing:
  ords_config_k6_testing:

networks:
  appnet: