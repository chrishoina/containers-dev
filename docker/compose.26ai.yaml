services:
  db23:
    image: container-registry.oracle.com/database/free:latest
    environment:
      - ORACLE_PDB=${ORACLE_PDB}
      - ORACLE_PWD=${ORACLE_PWD}
   
    volumes:
      - ved_db_demos:/opt/oracle/oradata/

    ports:
      - "1521:1521"
    networks:
      - appnet
    
    env_file:
      - ./.env
      
volumes:
  # db_k6_testing:
  ved_db_demos:

networks:
  appnet: