services:
  db:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in .env}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "127.0.0.1:${DB_PORT:-1521}:1521"
    volumes:
      - db-data:/opt/oracle/oradata
      
  ords:
    image: container-registry.oracle.com/database/ords:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DBHOST: db
      DBPORT: 1521
      DBSERVICENAME: ${ORACLE_PDB:-FREEPDB1}
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in .env}
      ORACLE_USER_PWD: ${ORACLE_USER_PWD:?Set ORACLE_USER_PWD in .env}
      ORDS_INSTANCE_API_USER_PWD: ${ORDS_INSTANCE_API_USER_PWD:?Set ORDS_INSTANCE_API_USER_PWD in .env}
      DEBUG: "FALSE"
    ports:
      - "127.0.0.1:${ORDS_PORT:-8080}:8080"
    volumes:
      - ords-config:/etc/ords/config
      - ./ords-entrypoint:/ords-entrypoint.d:ro
    healthcheck:
      # This built-in endpoint confirms ORDS is serving HTTP; it does not query the database.
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/ords/_/public-properties/ >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 3m

volumes:
  db-data:
  ords-config:
