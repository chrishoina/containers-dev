services:
  db:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
    ports:
      - "127.0.0.1:${DB_PORT:-1521}:1521"
    volumes:
      - db-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 5m

  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null && curl -fsS http://localhost:13133/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ords:
    image: ords-observability:latest
    build:
      context: ./ords
    depends_on:
      db:
        condition: service_healthy
      grafana-lgtm:
        condition: service_healthy
    environment:
      DBHOST: db
      DBPORT: 1521
      DBSERVICENAME: FREEPDB1
      ORACLE_PWD: ${ORACLE_PWD}
      ORACLE_USER_PWD: ${ORACLE_USER_PWD}
      OTEL_SERVICE_NAME: ords
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_JAVA_UTIL_LOGGING_ENABLED: "true"
    ports:
      - "127.0.0.1:${ORDS_PORT:-8080}:8080"
    volumes:
      - ords-config:/etc/ords/config
      - ./ords/jmx-exporter.yaml:/opt/oracle/ords/jmx-exporter.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/ords/_/public-properties/ >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 3m

volumes:
  db-data:
  ords-config:
